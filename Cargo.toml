[package]
name = "cubo_raytracing"
version = "0.1.0"
edition = "2021"

[dependencies]
raylib = "5.5"
nalgebra-glm = "0.21"

# Sin esto, correr en debug es tan lento que no se puede iterar:
# el codigo propio con optimizacion basica y las dependencias al maximo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
